<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jikan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b7bff"/>
      <stop offset="55%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 24h wheel ring -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="14"/>

  <!-- quarter ticks -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="16" stroke-linecap="round">
    <line x1="256" y1="106" x2="256" y2="132"/>
    <line x1="256" y1="380" x2="256" y2="406"/>
    <line x1="106" y1="256" x2="132" y2="256"/>
    <line x1="380" y1="256" x2="406" y2="256"/>
  </g>

  <!-- hands (10:10) -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round">
    <line x1="256" y1="256" x2="176" y2="186"/>
    <line x1="256" y1="256" x2="342" y2="176"/>
  </g>

  <circle cx="256" cy="256" r="22" fill="#ffffff"/>
</svg>