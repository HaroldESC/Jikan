<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Jikan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- dial track -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="48"/>

  <!-- elapsed slice of the 24 h day -->
  <path d="M256 114 A142 142 0 0 1 327 133" fill="none" stroke="#38bdf8" stroke-width="48" stroke-linecap="round"/>

  <!-- needle at the end of the arc -->
  <line x1="256" y1="256" x2="304" y2="173" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="17" fill="#ffffff"/>
</svg>